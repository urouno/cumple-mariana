<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Mariana</title>

<!-- ================================================================
     AQUÍ EDITAS TODO. Busca la palabra "EDITA" y cambia lo que quieras.
     ================================================================ -->

<style>
  :root{
    --noche: #241033;
    --uva: #3a1a4f;
    --durazno: #ffd9a0;
    --coral: #ff7f6b;
    --crema: #fff6ec;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100dvh;
    background:
      radial-gradient(120% 90% at 50% 0%, var(--uva) 0%, var(--noche) 70%);
    color:var(--crema);
    font-family:'Georgia','Times New Roman',serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 22px 40px;
    text-align:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }

  .encabezado{
    font-size:15px;
    letter-spacing:.14em;
    color:var(--durazno);
    opacity:.85;
    margin-bottom:26px;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }

  .escenario{
    width:100%;
    max-width:420px;
    min-height:52vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .frase{
    font-size:27px;
    line-height:1.5;
    font-style:italic;
  }

  .frase .firma{
    display:block;
    margin-top:18px;
    font-size:15px;
    font-style:normal;
    color:var(--durazno);
  }

  .foto{
    width:100%;
    border-radius:14px 14px 14px 60px;
    border:6px solid var(--crema);
    box-shadow:0 18px 40px rgba(0,0,0,.45);
    transform:rotate(-1.5deg);
  }

  .aparecer{ animation:aparecer .6s ease both; }
  @keyframes aparecer{
    from{ opacity:0; transform:translateY(14px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .pista{
    margin-top:30px;
    font-size:14px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    color:var(--coral);
  }

  @media (prefers-reduced-motion: reduce){
    .aparecer{ animation:none; }
  }
</style>
</head>

<body onclick="siguiente()">

  <!-- EDITA: el texto de arriba -->
  <p class="encabezado">Mariana · 24 años</p>

  <div class="escenario">
    <div id="escenario"></div>
  </div>

  <p class="pista">toca la pantalla</p>

<script>
/* ==========================================================
   EDITA AQUÍ: tus frases y tus fotos.
   - Para una frase escribe:  { tipo:"frase", texto:"lo que quieras" }
   - Para una foto escribe:   { tipo:"foto",  archivo:"fotos/foto1.jpg" }
   Puedes poner las que quieras, en el orden que quieras.
   ========================================================== */

const tarjetas = [
  { tipo:"frase", texto:"Feliz cumpleaños, mi amor <3." },
  { tipo:"foto",  archivo:"fotos/foto1.jpg" },
  { tipo:"frase", texto:"24 vueltas al sol y el sol sigue aprendiendo de ti." },
  { tipo:"foto",  archivo:"fotos/foto2.jpg" },
  { tipo:"frase", texto:"Contigo hasta lo ordinario se vuelve mi parte favorita del día." },
  { tipo:"foto",  archivo:"fotos/foto3.jpg" },
  { tipo:"frase", texto:"Eres maravillosa, y no lo digo hoy nada más." },
];

/* ---- de aquí para abajo ya no necesitas cambiar nada ---- */

let indice = -1;
const escenario = document.getElementById("escenario");

function siguiente(){
  indice = (indice + 1) % tarjetas.length;
  const t = tarjetas[indice];

  if (t.tipo === "foto") {
    escenario.innerHTML = '<img class="foto" src="' + t.archivo + '" alt="">';
  } else {
    escenario.innerHTML = '<p class="frase">' + t.texto + '</p>';
  }

  escenario.firstElementChild.classList.add("aparecer");
}

siguiente();
</script>
</body>
</html>
